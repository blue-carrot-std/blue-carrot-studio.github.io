<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tiger Eye Operations - Military vs Slimes</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            background-color: #1a2634;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-wrapper {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 850px;
            display: flex;
            flex-direction: column;
            background: #87ceeb;
        }
        #canvas-container {
            flex: 1;
            position: relative;
            width: 100%;
            background: linear-gradient(to bottom, #70c5ec 0%, #e0f7fa 100%);
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .touch-controls {
            background-color: #1c2d3d;
            display: flex;
            padding: 12px 18px;
            margin-bottom: 70px;
            margin-bottom: calc(65px + env(safe-area-inset-bottom, 20px));
            gap: 16px;
            border-top: 2px solid #385069;
        }
        .btn {
            flex: 1;
            height: 66px;
            background: linear-gradient(180deg, #5c6b2d 0%, #3d471b 100%);
            color: #ffffff;
            border: 2px solid #9db554;
            border-radius: 12px;
            font-size: 1.25rem;
            font-weight: 900;
            letter-spacing: 1px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px #151c0a;
            cursor: pointer;
        }
        .btn span {
            font-size: 0.7rem;
            font-weight: normal;
            opacity: 0.8;
            margin-top: 1px;
        }
        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px #151c0a;
            background: #3d471b;
        }
        .btn-fire {
            background: linear-gradient(180deg, #c0392b 0%, #8e2115 100%);
            border-color: #e74c3c;
        }
        .btn-fire:active {
            background: #8e2115;
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="canvas-container">
        <canvas id="gameCanvas" width="360" height="540"></canvas>
    </div>

    <div class="touch-controls">
        <button class="btn" id="btnJump">
            JUMP
            <span>[W / ↑]</span>
        </button>
        <button class="btn btn-fire" id="btnShoot">
            FIRE
            <span>[J / Space]</span>
        </button>
    </div>
</div>

<script>
// Web Audio API による効果音ジェネレーター
let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

const Sound = {
    jump() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.15);

        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
    },
    shoot() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.08);

        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
    },
    gem() {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.type = 'sine';
        osc.frequency.setValueAtTime(987.77, now); // B5
        osc.frequency.setValueAtTime(1318.51, now + 0.08); // E6

        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

        osc.start();
        osc.stop(now + 0.25);
    },
    hit() {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;

        const bufferSize = audioCtx.sampleRate * 0.12;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            output[i] = Math.random() * 2 - 1;
        }

        const whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1200, now);
        filter.frequency.exponentialRampToValueAtTime(300, now + 0.12);
        filter.Q.value = 3;

        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0.4, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

        whiteNoise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);

        const osc = audioCtx.createOscillator();
        const oscGain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.1);

        oscGain.gain.setValueAtTime(0.3, now);
        oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

        osc.connect(oscGain);
        oscGain.connect(audioCtx.destination);

        whiteNoise.start(now);
        osc.start(now);
        whiteNoise.stop(now + 0.12);
        osc.stop(now + 0.1);
    },
    gameOver() {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(80, now + 0.5);

        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);

        osc.start();
        osc.stop(now + 0.5);
    },
    clear() {
        if (!audioCtx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C E G C
        notes.forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.1);

            gain.gain.setValueAtTime(0.3, audioCtx.currentTime + i * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.1 + 0.3);

            osc.start(audioCtx.currentTime + i * 0.1);
            osc.stop(audioCtx.currentTime + i * 0.1 + 0.3);
        });
    }
};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const rawTitleImage = new Image();
rawTitleImage.src = '1965.png';

let titleImageCanvas = null;
let imageLoaded = false;

rawTitleImage.onload = () => {
    titleImageCanvas = document.createElement('canvas');
    const size = 500;
    titleImageCanvas.width = size;
    titleImageCanvas.height = size;
    const tCtx = titleImageCanvas.getContext('2d');

    tCtx.beginPath();
    tCtx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
    tCtx.closePath();
    tCtx.clip();

    const srcSize = rawTitleImage.width * 0.82;
    const srcX = (rawTitleImage.width - srcSize) / 2;
    const srcY = (rawTitleImage.height - srcSize) / 2 + 10;
    
    tCtx.drawImage(rawTitleImage, srcX, srcY, srcSize, srcSize, 0, 0, size, size);
    imageLoaded = true;
};

let gameState = 'START';
let score = 0;
let frameCount = 0;

const STAGE_LENGTH = 4500;
const BASE_GROUND_Y = 440;
const AUTO_SCROLL_SPEED = 3.2;

const platforms = [
    { x: 0, y: BASE_GROUND_Y, w: 1100, h: 100 },
    { x: 1260, y: BASE_GROUND_Y, w: 1000, h: 100 },
    { x: 2420, y: BASE_GROUND_Y, w: 1100, h: 100 },
    { x: 3680, y: BASE_GROUND_Y, w: 900, h: 100 },

    { x: 320, y: 350, w: 140, h: 22 },
    { x: 550, y: 280, w: 160, h: 22 },
    { x: 800, y: 340, w: 150, h: 22 },

    { x: 1120, y: 370, w: 120, h: 22 },
    { x: 1420, y: 320, w: 150, h: 22 },
    { x: 1680, y: 240, w: 160, h: 22 },
    { x: 1950, y: 330, w: 160, h: 22 },

    { x: 2280, y: 360, w: 120, h: 22 },
    { x: 2550, y: 300, w: 150, h: 22 },
    { x: 2800, y: 230, w: 180, h: 22 },
    { x: 3100, y: 310, w: 150, h: 22 },
    { x: 3400, y: 360, w: 150, h: 22 },
    { x: 3560, y: 370, w: 100, h: 22 }
];

let diamonds = [];
function initDiamonds() {
    diamonds = [
        { x: 390, y: 310 }, { x: 620, y: 240 }, { x: 870, y: 300 },
        { x: 1180, y: 330 }, { x: 1500, y: 280 }, { x: 1760, y: 200 },
        { x: 2020, y: 290 }, { x: 2340, y: 320 }, { x: 2620, y: 260 },
        { x: 2890, y: 190 }, { x: 3170, y: 270 }, { x: 3470, y: 320 },
        { x: 4000, y: 400 }
    ].map(d => ({ ...d, collected: false }));
}

function getDiamondStats() {
    const total = diamonds.length;
    const collected = diamonds.filter(d => d.collected).length;
    return { collected, total };
}

let enemies = [];
function initEnemies() {
    enemies = [
        { x: 500, y: BASE_GROUND_Y - 38, w: 42, h: 38, color: '#39ff14', isJumper: false },
        { x: 640, y: 280 - 36, w: 40, h: 36, color: '#00ffff', isJumper: false },
        { x: 920, y: BASE_GROUND_Y - 40, w: 46, h: 40, color: '#ff007f', isJumper: true, vy: 0, timer: 0 },
        { x: 1350, y: BASE_GROUND_Y - 38, w: 42, h: 38, color: '#39ff14', isJumper: false },
        { x: 1740, y: 240 - 36, w: 40, h: 36, color: '#00ffff', isJumper: false },
        { x: 2100, y: BASE_GROUND_Y - 40, w: 46, h: 40, color: '#ff007f', isJumper: true, vy: 0, timer: 0 },
        { x: 2620, y: 300 - 36, w: 40, h: 36, color: '#00ffff', isJumper: false },
        { x: 2950, y: BASE_GROUND_Y - 38, w: 42, h: 38, color: '#39ff14', isJumper: false },
        { x: 3250, y: BASE_GROUND_Y - 40, w: 46, h: 40, color: '#ff007f', isJumper: true, vy: 0, timer: 0 },
        { x: 3800, y: BASE_GROUND_Y - 38, w: 42, h: 38, color: '#39ff14', isJumper: false }
    ].map(e => ({ ...e, alive: true, baseY: e.y, anim: Math.random() * Math.PI }));
}

const player = {
    x: 70,
    y: BASE_GROUND_Y - 54,
    w: 36,
    h: 54,
    vy: 0,
    gravity: 0.72,
    jumpPower: -14,
    isGrounded: false,
    legPhase: 0,
    reset() {
        this.x = 70;
        this.y = BASE_GROUND_Y - this.h;
        this.vy = 0;
        this.isGrounded = true;
        this.legPhase = 0;
    },
    update() {
        this.vy += this.gravity;
        this.y += this.vy;
        this.isGrounded = false;

        platforms.forEach(p => {
            if (
                this.x + this.w * 0.7 > p.x &&
                this.x + this.w * 0.3 < p.x + p.w &&
                this.y + this.h >= p.y &&
                this.y + this.h <= p.y + p.h + 12 &&
                this.vy >= 0
            ) {
                this.y = p.y - this.h;
                this.vy = 0;
                this.isGrounded = true;
            }
        });

        if (this.y > canvas.height + 40) {
            triggerGameOver();
        }

        if (this.isGrounded) {
            this.legPhase += 0.3;
        }
    },
    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        ctx.fillStyle = '#556b2f';
        ctx.fillRect(8, 18, 20, 20);
        ctx.fillStyle = '#303d1a';
        ctx.fillRect(10, 22, 6, 6);
        ctx.fillRect(18, 28, 7, 6);

        ctx.fillStyle = '#f5cba7';
        ctx.fillRect(10, 8, 14, 11);

        ctx.fillStyle = '#3a4a1f';
        ctx.fillRect(8, 2, 18, 9);
        ctx.fillRect(6, 8, 22, 3);

        ctx.fillStyle = '#00e5ff';
        ctx.fillRect(16, 10, 8, 4);

        ctx.fillStyle = '#556b2f';
        ctx.fillRect(14, 20, 12, 7);
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(22, 22, 18, 5);
        ctx.fillRect(21, 27, 4, 6);

        ctx.fillStyle = '#384224';
        if (this.isGrounded) {
            const swing = Math.sin(this.legPhase) * 9;
            ctx.fillRect(10 + swing, 38, 7, 16);
            ctx.fillRect(18 - swing, 38, 7, 16);
            ctx.fillStyle = '#111';
            ctx.fillRect(10 + swing, 48, 9, 6);
            ctx.fillRect(18 - swing, 48, 9, 6);
        } else {
            ctx.fillRect(8, 38, 7, 13);
            ctx.fillRect(20, 40, 7, 11);
            ctx.fillStyle = '#111';
            ctx.fillRect(8, 48, 9, 6);
            ctx.fillRect(20, 48, 9, 6);
        }

        ctx.restore();
    }
};

function triggerGameOver() {
    if (gameState !== 'GAMEOVER') {
        gameState = 'GAMEOVER';
        Sound.gameOver();
    }
}

function triggerClear() {
    if (gameState !== 'CLEAR') {
        score += 3000;
        gameState = 'CLEAR';
        Sound.clear();
    }
}

let bullets = [];
function shootBullet() {
    bullets.push({
        x: player.x + player.w + 4,
        y: player.y + 24,
        r: 5,
        speed: 15
    });
    Sound.shoot();
}

let particles = [];
function createSplatter(x, y, color) {
    for (let i = 0; i < 20; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 2 + Math.random() * 6;
        particles.push({
            x, y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 2,
            r: 3 + Math.random() * 4,
            color,
            alpha: 1,
            gravity: 0.35
        });
    }
}

function drawDiamondShape(ctx, x, y, size) {
    ctx.save();
    ctx.translate(x, y);

    const w = size;
    const topH = size * 0.4;
    const botH = size * 0.8;
    const topW = size * 0.55;

    ctx.fillStyle = '#00d2ff';
    ctx.beginPath();
    ctx.moveTo(-topW, -topH);
    ctx.lineTo(topW, -topH);
    ctx.lineTo(w, 0);
    ctx.lineTo(-w, 0);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#0088cc';
    ctx.beginPath();
    ctx.moveTo(-w, 0);
    ctx.lineTo(w, 0);
    ctx.lineTo(0, botH);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.beginPath();
    ctx.moveTo(-topW * 0.4, -topH);
    ctx.lineTo(topW * 0.4, -topH);
    ctx.lineTo(w * 0.4, 0);
    ctx.lineTo(-w * 0.4, 0);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#005599';
    ctx.beginPath();
    ctx.moveTo(-w * 0.4, 0);
    ctx.lineTo(w * 0.4, 0);
    ctx.lineTo(0, botH);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-topW, -topH);
    ctx.lineTo(topW, -topH);
    ctx.lineTo(w, 0);
    ctx.lineTo(0, botH);
    ctx.lineTo(-w, 0);
    ctx.closePath();
    ctx.stroke();

    ctx.restore();
}

let cameraX = 0;

function updateGame() {
    frameCount++;
    player.x += AUTO_SCROLL_SPEED;
    cameraX = player.x - 70;

    if (player.x >= STAGE_LENGTH) {
        triggerClear();
        return;
    }

    player.update();

    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.speed;
        if (b.x > cameraX + canvas.width + 50) bullets.splice(i, 1);
    }

    diamonds.forEach(d => {
        if (!d.collected) {
            if (
                player.x + player.w > d.x - 14 &&
                player.x < d.x + 14 &&
                player.y + player.h > d.y - 14 &&
                player.y < d.y + 14
            ) {
                d.collected = true;
                score += 300;
                createSplatter(d.x, d.y, '#00f0ff');
                Sound.gem();
            }
        }
    });

    enemies.forEach(e => {
        if (!e.alive) return;
        e.anim += 0.12;

        if (e.isJumper) {
            e.timer++;
            if (e.timer > 65 && e.y >= e.baseY) {
                e.vy = -10;
                e.timer = 0;
            }
            e.vy += 0.55;
            e.y += e.vy;
            if (e.y >= e.baseY) {
                e.y = e.baseY;
                e.vy = 0;
            }
        }

        for (let j = bullets.length - 1; j >= 0; j--) {
            const b = bullets[j];
            if (
                b.x + b.r > e.x && b.x - b.r < e.x + e.w &&
                b.y + b.r > e.y && b.y - b.r < e.y + e.h
            ) {
                e.alive = false;
                createSplatter(e.x + e.w / 2, e.y + e.h / 2, e.color);
                bullets.splice(j, 1);
                score += 150;
                Sound.hit();
                break;
            }
        }

        if (e.alive) {
            const pad = 6;
            if (
                player.x + player.w - pad > e.x &&
                player.x + pad < e.x + e.w &&
                player.y + player.h - pad > e.y &&
                player.y + pad < e.y + e.h
            ) {
                triggerGameOver();
            }
        }
    });

    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.alpha -= 0.03;
        if (p.alpha <= 0) particles.splice(i, 1);
    }
}

function draw() {
    // 晴天グラデーション背景
    const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    bgGrad.addColorStop(0, '#53b4e6');
    bgGrad.addColorStop(0.6, '#a1e3ff');
    bgGrad.addColorStop(1, '#e0f7fa');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-cameraX, 0);

    // 遠景の山脈（明るいグリーン系）
    ctx.fillStyle = '#6bb07b';
    for (let i = 0; i < 20; i++) {
        ctx.beginPath();
        ctx.moveTo(i * 300, BASE_GROUND_Y);
        ctx.lineTo(i * 300 + 150, 240);
        ctx.lineTo(i * 300 + 300, BASE_GROUND_Y);
        ctx.fill();
    }

    // プラットフォーム
    platforms.forEach(p => {
        ctx.fillStyle = '#8b5a2b';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = '#4caf50';
        ctx.fillRect(p.x, p.y, p.w, 8);
        ctx.strokeStyle = '#3e2723';
        ctx.lineWidth = 2;
        ctx.strokeRect(p.x, p.y, p.w, p.h);
    });

    // ダイヤ
    diamonds.forEach(d => {
        if (d.collected) return;
        drawDiamondShape(ctx, d.x, d.y, 14);
    });

    // ゴール
    const goalX = STAGE_LENGTH;
    ctx.fillStyle = '#333333';
    ctx.fillRect(goalX, BASE_GROUND_Y - 140, 6, 140);
    ctx.fillStyle = '#ff1744';
    ctx.beginPath();
    ctx.moveTo(goalX + 6, BASE_GROUND_Y - 140);
    ctx.lineTo(goalX + 50, BASE_GROUND_Y - 110);
    ctx.lineTo(goalX + 6, BASE_GROUND_Y - 80);
    ctx.closePath();
    ctx.fill();

    // 弾丸
    ctx.fillStyle = '#ffea00';
    bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ff6f00';
        ctx.lineWidth = 1;
        ctx.stroke();
    });

    // スライム
    enemies.forEach(e => {
        if (!e.alive) return;
        ctx.save();
        ctx.translate(e.x, e.y);

        const squish = Math.sin(e.anim) * 3;
        const w = e.w + squish;
        const h = e.h - squish;

        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.moveTo(2, h);
        ctx.bezierCurveTo(0, h * 0.2, w * 0.2, 0, w * 0.5, 0);
        ctx.bezierCurveTo(w * 0.8, 0, w, h * 0.2, w - 2, h);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.fillRect(w * 0.25, h * 0.35, 7, 7);
        ctx.fillRect(w * 0.6, h * 0.35, 7, 7);
        ctx.fillStyle = '#000';
        ctx.fillRect(w * 0.32, h * 0.4, 4, 4);
        ctx.fillRect(w * 0.67, h * 0.4, 4, 4);

        ctx.restore();
    });

    // パーティクル
    particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });

    // プレイヤー描画
    player.draw();

    ctx.restore();

    // UI表示 (文字縁取りで水色背景での視認性を確保)
    ctx.fillStyle = '#1a2634';
    ctx.font = '900 18px sans-serif';
    ctx.fillText(`SCORE: ${score}`, 16, 32);

    const progress = Math.min(1, Math.max(0, player.x / STAGE_LENGTH));
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillRect(16, 44, 160, 10);
    ctx.fillStyle = '#2e7d32';
    ctx.fillRect(16, 44, 160 * progress, 10);
    ctx.strokeStyle = '#1a2634';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(16, 44, 160, 10);

    // タイトル画面の表示
    if (gameState === 'START') {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (imageLoaded && titleImageCanvas) {
            const imgRadius = 135;
            const centerX = canvas.width / 2;
            const centerY = 210;

            const glow = ctx.createRadialGradient(centerX, centerY, 50, centerX, centerY, imgRadius + 20);
            glow.addColorStop(0, 'rgba(212, 175, 55, 0.4)');
            glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(centerX, centerY, imgRadius + 20, 0, Math.PI * 2);
            ctx.fill();

            ctx.drawImage(
                titleImageCanvas,
                centerX - imgRadius,
                centerY - imgRadius,
                imgRadius * 2,
                imgRadius * 2
            );

            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(centerX, centerY, imgRadius, 0, Math.PI * 2);
            ctx.stroke();
        }

        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffd700';
        ctx.font = '900 22px sans-serif';
        ctx.fillText('TIGER EYE OPERATIONS', canvas.width / 2, 385);

        const pulse = Math.abs(Math.sin(frameCount * 0.05));
        ctx.fillStyle = `rgba(255, 255, 255, ${0.4 + pulse * 0.6})`;
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText('PRESS BUTTON TO START', canvas.width / 2, 445);
        ctx.textAlign = 'left';

    } else if (gameState === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff5252';
        ctx.font = '900 30px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, 210);
        ctx.fillStyle = '#fff';
        ctx.font = '18px sans-serif';
        ctx.fillText(`SCORE: ${score}`, canvas.width / 2, 255);
        ctx.font = '15px sans-serif';
        ctx.fillText('ボタンを押してリトライ', canvas.width / 2, 305);
        ctx.textAlign = 'left';

    } else if (gameState === 'CLEAR') {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const cx = canvas.width / 2;

        ctx.fillStyle = '#1e293b';
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(24, 70, canvas.width - 48, 380, 16);
        ctx.fill();
        ctx.stroke();

        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffd700';
        ctx.font = '900 28px sans-serif';
        ctx.fillText('STAGE CLEAR!', cx, 125);

        ctx.fillStyle = '#ffb700';
        ctx.beginPath();
        ctx.arc(cx, 165, 22, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#1e293b';
        ctx.font = '900 22px sans-serif';
        ctx.fillText('★', cx, 173);

        ctx.fillStyle = '#94a3b8';
        ctx.font = 'bold 13px sans-serif';
        ctx.fillText('FINAL SCORE', cx, 220);

        ctx.fillStyle = '#ffffff';
        ctx.font = '900 32px sans-serif';
        ctx.fillText(score.toLocaleString(), cx, 258);

        const stats = getDiamondStats();
        const rate = Math.round((stats.collected / stats.total) * 100);

        drawDiamondShape(ctx, cx - 75, 305, 12);

        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 15px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('DIAMONDS', cx - 50, 310);

        ctx.textAlign = 'center';
        ctx.fillStyle = '#f1f5f9';
        ctx.font = '900 22px sans-serif';
        ctx.fillText(`${stats.collected} / ${stats.total} (${rate}%)`, cx, 345);

        const pulse = Math.abs(Math.sin(frameCount * 0.06));
        ctx.fillStyle = `rgba(255, 255, 255, ${0.5 + pulse * 0.5})`;
        ctx.font = 'bold 15px sans-serif';
        ctx.fillText('PRESS BUTTON TO NEXT', cx, 415);

        ctx.textAlign = 'left';
    }
}

function gameLoop() {
    frameCount++;
    if (gameState === 'PLAYING') {
        updateGame();
    }
    draw();
    requestAnimationFrame(gameLoop);
}

function actionJump() {
    initAudio();
    if (gameState === 'PLAYING') {
        if (player.isGrounded) {
            player.vy = player.jumpPower;
            player.isGrounded = false;
            Sound.jump();
        }
    } else {
        startGame();
    }
}

function actionShoot() {
    initAudio();
    if (gameState === 'PLAYING') {
        shootBullet();
    } else {
        startGame();
    }
}

function startGame() {
    score = 0;
    bullets = [];
    particles = [];
    initDiamonds();
    initEnemies();
    player.reset();
    cameraX = 0;
    gameState = 'PLAYING';
}

window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (['KeyW', 'ArrowUp', 'Space'].includes(e.code)) {
        e.preventDefault();
        actionJump();
    } else if (['KeyJ', 'KeyZ', 'Enter'].includes(e.code)) {
        e.preventDefault();
        actionShoot();
    }
});

const btnJump = document.getElementById('btnJump');
const btnShoot = document.getElementById('btnShoot');

btnJump.addEventListener('touchstart', (e) => { e.preventDefault(); actionJump(); });
btnJump.addEventListener('mousedown', (e) => { e.preventDefault(); actionJump(); });

btnShoot.addEventListener('touchstart', (e) => { e.preventDefault(); actionShoot(); });
btnShoot.addEventListener('mousedown', (e) => { e.preventDefault(); actionShoot(); });

gameLoop();
</script>
</body>
</html>
